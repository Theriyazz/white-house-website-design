# Netlify builds the Next.js site in white-house-web/ as a static export.
[build]
  base = "white-house-web"
  command = "npm run build"
  publish = "out"

[build.environment]
  STATIC_EXPORT = "1"
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
